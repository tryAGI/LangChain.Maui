name: Build, test and publish
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-test-publish:
    name: Build, test and publish
    uses: HavenDV/workflows/.github/workflows/dotnet_build-test-publish.yml@main
    with:
      dotnet-version: 8.0.x
      project-path: src/libs/LangChain.Providers.Maui/LangChain.Providers.Maui.csproj
      additional-command: dotnet build samples/LangChain.Samples.Maui/LangChain.Samples.Maui.csproj --framework net8.0-windows10.0.19041.0 --configuration Release --nologo
      run-tests: false
      os: windows-latest
      generate-build-number: false
      conventional-commits-publish-conditions: false
      workloads: maui
      install-tizen: true
      enable-caching: false
      additional-test-arguments: '--logger GitHubActions'

  auto-stable-release:
    needs: [build-test-publish]
    if: github.ref == 'refs/heads/main'
    uses: tryAGI/workflows/.github/workflows/auto-stable-release.yml@main
    with:
      project-path: src/libs/LangChain.Providers.Maui/LangChain.Providers.Maui.csproj
      os: windows-latest
      dotnet-version: 8.0.x
      workloads: maui
      candidate-source: build

  nuget-trusted-publish:
    name: NuGet trusted publishing
    needs: build-test-publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: tryAGI/workflows/.github/actions/nuget-publish@main
        with:
          user: havendv
          artifact-pattern: nuget-packages-windows-latest
